services:
  app:
    build:
      context: .
    profiles: [app]
#    ports:
#      - "127.0.0.1:${SERVER_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      # Cloudflare's tunnel is the only way in (no published ports), so its CF-Connecting-IP
      # header is the visitor's real address. Never enable this if the port is published.
      CREDAPP_CLOUDFLARE_TRUST_CLIENT_IP: "true"
      DB_HOST: db
      DB_NAME: ${DB_NAME:-credapp}
      DB_USERNAME: ${DB_USERNAME:-credapp}
      DB_PASSWORD: ${DB_PASSWORD:-pass}
      DEV_PASSWORD: ${DEV_PASSWORD:-devpass}
      DEV_GROUP_NAME: ${DEV_GROUP_NAME:-}
      CREDAPP_SSN_KEY: ${CREDAPP_SSN_KEY}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: [app]
    command: tunnel --no-autoupdate run
    restart: unless-stopped
    depends_on: [app]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}

  db:
    image: postgres:17
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-credapp}
      POSTGRES_USER: ${DB_USERNAME:-credapp}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pass}
    volumes:
      - data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  data:

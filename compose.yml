services:
  app:
    build:
      context: .
    profiles: [app]
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_HOST: db
      DB_NAME: ${DB_NAME:-credapp}
      DB_USERNAME: ${DB_USERNAME:-credapp}
      DB_PASSWORD: ${DB_PASSWORD:-pass}
      DEV_PASSWORD: ${DEV_PASSWORD:-devpass}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-credapp}
      POSTGRES_USER: ${DB_USERNAME:-credapp}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pass}
    volumes:
      - data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  data:
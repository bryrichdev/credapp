name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: ./mvnw -B verify
        env:
          CREDAPP_SSN_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=

  extension:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright-core install --with-deps chromium
      - run: npm test

  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [ self-hosted, credcloud ]
    concurrency: deploy-staging
    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: docker build -t "credcloud:${GITHUB_SHA::7}" .

      - name: Deploy to staging
        run: bash deploy/deploy.sh staging "${GITHUB_SHA::7}"
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: ./mvnw -B verify
        env:
          CREDAPP_SSN_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=

  helper:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: helper
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: helper/go.mod
          cache-dependency-path: helper/go.sum
      - run: go vet ./...
      - run: GOOS=darwin go vet ./... && GOOS=windows go vet ./...
      # The runner comes with Google Chrome. Headless, and without Chrome's sandbox, which the
      # runner's AppArmor settings don't allow.
      - run: go test ./...
        env:
          CREDCLOUD_BROWSER_ARGS: --headless=new --no-sandbox
      - run: sh build.sh

  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [ self-hosted, credcloud ]
    concurrency: deploy-staging
    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: docker build -t "credcloud:${GITHUB_SHA::7}" .

      - name: Deploy to staging
        run: bash deploy/deploy.sh staging "${GITHUB_SHA::7}"
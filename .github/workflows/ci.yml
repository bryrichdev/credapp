name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: ./mvnw -B verify
        env:
          CREDAPP_SSN_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=

  deploy-staging:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [ self-hosted, credcloud ]
    concurrency: deploy-staging
    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: docker build -t "credcloud:${GITHUB_SHA::7}" .

      - name: Deploy to staging
        run: |
          APP_TAG="${GITHUB_SHA::7}" docker compose -f deploy/compose.yml -p credcloud-staging \
            --env-file "$HOME/credcloud/staging/.env" up -d --wait --wait-timeout 180
          echo "${GITHUB_SHA::7}" > "$HOME/credcloud/staging/deployed"

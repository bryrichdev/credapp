<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Allow CredCloud on this portal</title>
  <style>
    body { font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #1a202c; background: #f7fafc; margin: 0; }
    main { max-width: 560px; margin: 64px auto; background: #fff; border: 1px solid #cbd5e0; border-radius: 10px; padding: 24px 28px; }
    h1 { font-size: 20px; margin: 0 0 12px; color: #1f3a5f; }
    button { font: inherit; padding: 8px 14px; border-radius: 6px; border: 1px solid #1f3a5f; background: #1f3a5f; color: #fff; cursor: pointer; }
    button.quiet { background: #fff; color: #1f3a5f; margin-left: 8px; }
    .error { color: #9b2c2c; }
  </style>
</head>
<body>
<main>
  <h1>Allow CredCloud on <span id="host">this portal</span>?</h1>
  <p>To fill this payer's forms, CredCloud needs to work on its pages. Chrome asks you once per portal.</p>
  <p>CredCloud only types into the boxes you've taught it, when you press Fill this page. It never presses submit, and it never sees your portal password.</p>
  <p><button id="allow">Allow and open the portal</button><button id="cancel" class="quiet">Not now</button></p>
  <p id="message" class="error" role="alert"></p>
</main>
<script src="grant.js"></script>
</body>
</html>

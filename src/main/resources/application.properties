spring.application.name=credapp

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:credapp}
spring.datasource.username=${DB_USERNAME:credapp}
spring.datasource.password=${DB_PASSWORD:pass}
spring.jpa.hibernate.ddl-auto=validate
spring.data.web.pageable.max-page-size=100
spring.session.jdbc.initialize-schema=never
server.servlet.session.timeout=30m

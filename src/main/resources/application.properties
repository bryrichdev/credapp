spring.application.name=credapp

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:credapp}
spring.datasource.username=${DB_USERNAME:credapp}
spring.datasource.password=${DB_PASSWORD:pass}
spring.jpa.hibernate.ddl-auto=validate
spring.data.web.pageable.max-page-size=100
spring.session.jdbc.initialize-schema=never
server.servlet.session.timeout=30m
# Onboarding workbooks; the import page turns away anything over 10 MB with its own message.
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
credapp.security.ssn-key=${CREDAPP_SSN_KEY}

spring.jpa.properties.hibernate.tenant_identifier_resolver=dev.bryrich.credapp.usergroup.CurrentUserGroupResolver

# Where the app is reached from outside. Links in emails are built from this, never from the
# request, so a forged Host header can't point a reset link somewhere else.
credapp.base-url=${CREDAPP_BASE_URL:http://localhost:8080}

# Outgoing email over SMTP. With no MAIL_HOST, emails are logged instead of sent. For Gmail:
# MAIL_HOST=smtp.gmail.com, MAIL_USERNAME=the address, MAIL_PASSWORD=an app password.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# Who emails come from. Empty means "CredCloud <MAIL_USERNAME>", which is what Gmail requires.
credapp.mail.from=${MAIL_FROM:}
# The health check the deploy waits on must not depend on the mail server being reachable.
management.health.mail.enabled=false

# Admins and superusers must use two-step sign-in (a code from an authenticator app).
credapp.two-step.required-for-admins=true

# Where uploaded documents go. "database" keeps them in Postgres, as staging and local runs do.
# "s3" gives each workspace its own bucket, made on its first upload (see aws/storage.tf).
# Documents already stored stay where they are and open either way.
credapp.storage.mode=${CREDAPP_STORAGE:database}
credapp.storage.bucket-prefix=${CREDAPP_STORAGE_BUCKET_PREFIX:}
credapp.storage.data-role-arn=${CREDAPP_STORAGE_DATA_ROLE_ARN:}
credapp.storage.region=${AWS_REGION:us-east-1}

# CredCloud Helper's builds, served for installing and for helpers to update themselves. The
# Docker image builds them into /app/helper; for a local run, helper/build.sh puts them in
# helper/dist. Empty: none to serve, and helpers don't update.
credapp.helper.dir=${CREDAPP_HELPER_DIR:}

# Where the privacy page sends questions and data requests. Empty says to ask a workspace admin.
credapp.contact-email=${CREDAPP_CONTACT_EMAIL:}

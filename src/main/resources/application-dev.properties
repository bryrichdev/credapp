credapp.dev.admin-email=dev@credapp.local
credapp.dev.admin-password=${DEV_PASSWORD:devpass}
credapp.dev.admin-group-name=${DEV_GROUP_NAME:}
management.endpoints.web.exposure.include=health,env
spring.docker.compose.lifecycle-management=start-only
server.address=0.0.0.0
server.port=8080
# No email service in dev: print emails, links included, to the log.
credapp.mail.log-body=true
# Two-step sign-in stays optional in dev, so the dev superuser signs in with just a password.
# Set to true to try the admin requirement locally.
credapp.two-step.required-for-admins=false
# CredCloud Helper's test portal (go run . portal, in helper/) is plain http on this computer.
credapp.portal.allow-local-http=true
# Builds from helper/build.sh, so the install commands work against a local server.
credapp.helper.dir=${CREDAPP_HELPER_DIR:helper/dist}

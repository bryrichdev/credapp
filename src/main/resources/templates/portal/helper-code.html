<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connect CredCloud Helper · CredCloud</title><link rel="stylesheet" th:href="@{/css/app.css}"><link rel="icon" th:href="@{/favicon.ico}"></head>
<body><div th:replace="~{fragments/layout :: topbar(${user}, 'account')}"></div>
<main class="page">
<a class="backlink" th:href="@{/account/browsers}">&larr; Back to connected computers</a>
<div class="page__header"><h1>Connect CredCloud Helper</h1>
<p class="page__subtitle">This code connects one computer to your account (<span th:text="${user.email}"></span>). It works once, until
<time data-local-time th:datetime="${expiresAt}" th:text="${expiresAt}"></time>. Nothing else can use it, and it's shown only this once.</p></div>
<section class="card">
<p>In the helper folder, run:</p>
<p><code th:text="'go run . pair ' + ${server} + ' ' + ${code}"></code>
<button class="button button--quiet button--small" type="button" th:attr="data-copy='go run . pair ' + ${server} + ' ' + ${code}">Copy</button></p>
</section>
</main><div th:replace="~{fragments/layout :: footer}"></div>
<script th:src="@{/js/copy-answers.js}"></script><script th:src="@{/js/local-time.js}"></script></body></html>

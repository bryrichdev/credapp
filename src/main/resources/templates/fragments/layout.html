<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<th:block th:fragment="topbar(user, section)">
<header class="topbar" data-topbar>
    <div class="topbar__left">
        <a class="topbar__brand" th:href="@{/}">
            <img class="topbar__mark" th:src="@{/favicon.svg}" alt="" width="30" height="30">
            <span>CredCloud</span>
        </a>

        <nav class="topnav" id="topbar-nav" aria-label="Main navigation">
            <a class="topnav__link" th:classappend="${section == 'providers'} ? 'topnav__link--active'"
               th:attr="aria-current=${section == 'providers'} ? 'page'"
               th:href="@{/providers}">Providers</a>
            <a class="topnav__link" th:classappend="${section == 'licenses'} ? 'topnav__link--active'"
               th:attr="aria-current=${section == 'licenses'} ? 'page'"
               th:href="@{/licenses}">Licenses</a>
            <a class="topnav__link" th:classappend="${section == 'groups'} ? 'topnav__link--active'"
               th:attr="aria-current=${section == 'groups'} ? 'page'"
               th:href="@{/groups}">Groups</a>
            <a class="topnav__link" th:classappend="${section == 'owners'} ? 'topnav__link--active'"
               th:attr="aria-current=${section == 'owners'} ? 'page'"
               th:href="@{/owners}">Owners</a>
            <a class="topnav__link" th:classappend="${section == 'payers'} ? 'topnav__link--active'"
               th:attr="aria-current=${section == 'payers'} ? 'page'"
               th:href="@{/payers}">Payers</a>
            <a class="topnav__link" th:classappend="${section == 'tracking'} ? 'topnav__link--active'"
               th:attr="aria-current=${section == 'tracking'} ? 'page'"
               th:href="@{/tracking}"
               th:with="due=${trackingBadge != null ? trackingBadge.count : 0}">Tracking<span
                    class="topnav__count" th:if="${due > 0}" th:text="${due > 99 ? '99+' : due}"
                    th:title="${due} + ' need attention'">3</span></a>
            <a class="topnav__link" th:classappend="${section == 'users'} ? 'topnav__link--active'"
               th:attr="aria-current=${section == 'users'} ? 'page'"
               th:href="@{/admin/users}"
               th:if="${isAdmin}">Users</a>
            <a class="topnav__link" th:classappend="${section == 'import'} ? 'topnav__link--active'"
               th:attr="aria-current=${section == 'import'} ? 'page'"
               th:href="@{/admin/import}"
               th:if="${isAdmin}">Import</a>
        </nav>
    </div>

    <div class="topbar__right">
        <div class="topbar__account">
            <span class="badge badge--inactive" th:unless="${canEdit}">Read only</span>
            <a class="topbar__user" th:classappend="${section == 'account'} ? 'topbar__user--active'"
               th:href="@{/account}" th:title="'My account: ' + ${user.email}">
                <span class="topbar__user-label">My account</span>
                <span class="topbar__user-email" th:text="${user.email}">user@example.com</span>
            </a>
            <form method="post" th:action="@{/logout}">
                <button class="button button--quiet" type="submit">Sign out</button>
            </form>
        </div>

        <!-- Phones only; layout.js wires it up. Without the script the full bar shows instead. -->
        <button class="topbar__menu-button" type="button" aria-expanded="false"
                aria-controls="topbar-nav" data-topbar-toggle hidden>
            <span class="topbar__menu-icon" aria-hidden="true"></span>
            <span>Menu</span>
        </button>
    </div>
</header>
<script th:src="@{/js/layout.js}" defer></script>
<script th:src="@{/js/modal.js}" defer></script>

<!-- A superuser looking at another user group: say whose it is and that it's read-only. -->
<div class="viewing-banner" role="status" th:if="${viewingGroupName != null}">
    <span>
        Viewing <strong th:text="${viewingGroupName}">Group</strong> as its admin sees it
        <span class="viewing-banner__note">&middot; read-only</span>
    </span>
    <form method="post" th:action="@{/admin/user-groups/view/exit}">
        <button class="button button--small" type="submit">Back to my group</button>
    </form>
</div>
</th:block>

<footer class="sitefoot" th:fragment="footer">
    <div class="sitefoot__inner">
        <div class="sitefoot__left">
            <img class="sitefoot__mark" th:src="@{/favicon.svg}" alt="" width="22" height="22">
            <span class="sitefoot__name">CredCloud</span>
            <span aria-hidden="true" class="sitefoot__sep">&middot;</span>
            <span class="sitefoot__note">Provider credentialing and license tracking</span>
        </div>
        <span class="sitefoot__meta"
              th:text="'&copy; ' + ${#dates.year(#dates.createNow())} + ' CredCloud'">&copy; 2026 CredCloud</span>
    </div>
</footer>

</body>
</html>

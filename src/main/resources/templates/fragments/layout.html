<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<header class="topbar" th:fragment="topbar(user, section)">
    <div class="topbar__left">
        <a class="topbar__brand" th:href="@{/}">
            <span class="topbar__mark">CA</span>
            <span>CredApp</span>
        </a>

        <nav class="topnav">
            <a class="topnav__link" th:href="@{/providers}"
               th:classappend="${section == 'providers'} ? 'topnav__link--active'">Providers</a>
            <a class="topnav__link" th:href="@{/licenses}"
               th:classappend="${section == 'licenses'} ? 'topnav__link--active'">Licenses</a>
        </nav>
    </div>

    <div class="topbar__right">
        <span class="topbar__user" th:text="${user.email}">user@example.com</span>
        <form th:action="@{/logout}" method="post">
            <button class="button button--quiet" type="submit">Sign out</button>
        </form>
    </div>
</header>

<footer class="sitefoot" th:fragment="footer">
    <div class="sitefoot__inner">
        <div class="sitefoot__left">
            <span class="sitefoot__mark">CA</span>
            <span class="sitefoot__name">CredApp</span>
            <span class="sitefoot__sep" aria-hidden="true">&middot;</span>
            <span class="sitefoot__note">Provider credentialing and license tracking</span>
        </div>
        <span class="sitefoot__meta"
              th:text="'&copy; ' + ${#dates.year(#dates.createNow())} + ' CredApp'">&copy; 2026 CredApp</span>
    </div>
</footer>

</body>
</html>

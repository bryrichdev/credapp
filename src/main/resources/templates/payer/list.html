<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Payers &middot; CredApp</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<div th:replace="~{fragments/layout :: topbar(${user}, 'payers')}"></div>

<main class="page">

    <div class="page__header page__header--row">
        <div>
        <h1>Payers</h1>
        <p class="page__subtitle">
            <span th:if="${name == null or name.isBlank()}"
                  th:text="${page.totalElements} + ' payer(s)'">0 payers</span>
            <span th:unless="${name == null or name.isBlank()}"
                  th:text="${page.totalElements} + ' result(s) for &quot;' + ${name} + '&quot;'">0 results</span>
        </p>
        </div>
        <a class="button" th:href="@{/payers/new}" th:if="${canEdit}">Add payer</a>
    </div>

    <form class="toolbar" th:action="@{/payers}" method="get">
        <input class="field__input toolbar__input"
               type="search"
               name="name"
               th:value="${name}"
               placeholder="Search by name">
        <button class="button" type="submit">Search</button>
        <a class="button button--quiet"
           th:if="${name != null and !name.isBlank()}"
           th:href="@{/payers}">Clear</a>
    </form>

    <section class="card card--flush">
        <div class="table-scroll" role="region" tabindex="0" aria-label="Payer" th:unless="${page.isEmpty()}">
            <table class="table">
                <thead>
                <tr>
                    <th>Name</th>
                    <th>Note</th>
                    <th>Added</th>
                    <th class="table__actions" th:if="${canEdit}"></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="payer : ${page.content}">
                    <td>
                        <a class="rowlink rowlink--strong" th:href="@{/payers/{id}(id=${payer.id})}"
                           th:text="${payer.name}"></a>
                    </td>
                    <td>
                        <a class="rowlink" th:href="@{/payers/{id}(id=${payer.id})}"
                           th:text="${payer.note} ?: '—'"></a>
                    </td>
                    <td>
                        <a class="rowlink" th:href="@{/payers/{id}(id=${payer.id})}"
                           th:text="${payer.createdAt}"></a>
                    </td>
                    <td class="table__actions" th:if="${canEdit}">
                        <div class="row-actions" th:if="${canEdit}">
                            <a class="button button--quiet button--small"
                               th:href="@{/payers/{id}(id=${payer.id}, edit=1)}" th:if="${canEdit}">Edit</a>
                            <form th:action="@{/payers/{id}/delete(id=${payer.id})}" method="post"
                                  onsubmit="return confirm('Delete this payer and all of its contacts?');">
                                <button class="button button--danger button--small" type="submit">Delete</button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="empty" th:if="${page.isEmpty()}">
            <p class="empty__title">No payers found</p>
            <p class="empty__hint" th:if="${name != null and !name.isBlank()}">
                Try a shorter search term.
            </p>
        </div>
    </section>

    <nav class="pagination" th:if="${page.totalPages > 1}">
        <a class="button button--quiet"
           th:if="${page.hasPrevious()}"
           th:href="@{/payers(page=${page.number - 1}, size=${page.size}, name=${name})}">Previous</a>
        <span th:unless="${page.hasPrevious()}"></span>

        <span class="pagination__status"
              th:text="'Page ' + (${page.number} + 1) + ' of ' + ${page.totalPages}">Page 1 of 1</span>

        <a class="button button--quiet"
           th:if="${page.hasNext()}"
           th:href="@{/payers(page=${page.number + 1}, size=${page.size}, name=${name})}">Next</a>
        <span th:unless="${page.hasNext()}"></span>
    </nav>

</main>

<div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>

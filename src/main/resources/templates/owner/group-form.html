<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Add group &middot; CredCloud</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="icon" th:href="@{/favicon.ico}" sizes="any">
    <link rel="icon" th:href="@{/favicon.svg}" type="image/svg+xml">
    <link rel="apple-touch-icon" th:href="@{/apple-touch-icon.png}">
</head>
<body>

<div th:replace="~{fragments/layout :: topbar(${user}, 'owners')}"></div>

<main class="page">

    <a class="backlink" th:href="@{/owners/{id}(id=${owner.id})}">&larr; Back to owner</a>

    <div class="page__header">
        <h1 data-modal-title>Add group</h1>
        <p class="page__subtitle">The same person can hold a different share in each group they own.</p>
    </div>

    <section class="card" data-modal-content>
        <p class="context-line">
            For
            <strong th:text="${owner.firstName} + ' ' + ${owner.lastName}"></strong>
        </p>

        <form method="post" th:action="@{/owners/{id}/groups(id=${owner.id})}" th:object="${form}">

            <div class="form-grid">
                <label class="field field--wide">
                    <span class="field__label">Group</span>
                    <select class="field__input" th:field="*{groupId}"
                            th:classappend="${#fields.hasErrors('groupId')} ? 'field__input--invalid'">
                        <option th:value="''">Select a group</option>
                        <option th:each="option : ${groups}"
                                th:value="${option.id}"
                                th:text="${option.lbn}"></option>
                    </select>
                    <span class="field__error" th:errors="*{groupId}"
                          th:if="${#fields.hasErrors('groupId')}"></span>
                </label>

                <label class="field">
                    <span class="field__label">Percent owned</span>
                    <input class="field__input" type="number" step="0.01" min="0.01" max="100"
                           th:field="*{percentOwned}"
                           th:classappend="${#fields.hasErrors('percentOwned')} ? 'field__input--invalid'">
                    <span class="field__error" th:errors="*{percentOwned}"
                          th:if="${#fields.hasErrors('percentOwned')}"></span>
                </label>

                <label class="field">
                    <span class="field__label">Effective date</span>
                    <input class="field__input" type="date" th:field="*{effectiveDate}">
                </label>
            </div>

            <div class="form-actions">
                <button class="button" type="submit">Save group</button>
                <a class="button button--quiet" th:href="@{/owners/{id}(id=${owner.id})}" data-modal-cancel>Cancel</a>
            </div>
        </form>
    </section>

</main>

<div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>

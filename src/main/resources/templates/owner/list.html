<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Owners &middot; CredCloud</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="icon" th:href="@{/favicon.ico}" sizes="any">
    <link rel="icon" th:href="@{/favicon.svg}" type="image/svg+xml">
    <link rel="apple-touch-icon" th:href="@{/apple-touch-icon.png}">
</head>
<body>

<div th:replace="~{fragments/layout :: topbar(${user}, 'owners')}"></div>

<main class="page">

    <div class="page__header page__header--row">
        <div>
        <h1>Owners</h1>
        <p class="page__subtitle">
            <span th:if="${lastName == null or lastName.isBlank()}"
                  th:text="${page.totalElements} + ' owner(s)'">0 owners</span>
            <span th:unless="${lastName == null or lastName.isBlank()}"
                  th:text="${page.totalElements} + ' result(s) for &quot;' + ${lastName} + '&quot;'">0 results</span>
        </p>
        </div>
        <a class="button" th:href="@{/owners/new}" th:if="${canEdit}">Add owner</a>
    </div>

    <form class="toolbar" th:action="@{/owners}" method="get">
        <input class="field__input toolbar__input"
               type="search"
               name="lastName"
               th:value="${lastName}"
               placeholder="Search by last name">
        <button class="button" type="submit">Search</button>
        <a class="button button--quiet"
           th:if="${lastName != null and !lastName.isBlank()}"
           th:href="@{/owners}">Clear</a>
    </form>

    <section class="card card--flush">
        <div class="table-scroll" role="region" tabindex="0" aria-label="Owner" th:unless="${page.isEmpty()}">
            <table class="table">
                <thead>
                <tr>
                    <th>Name</th>
                    <th>Date of birth</th>
                    <th>Home address</th>
                    <th class="table__actions" th:if="${canEdit}"></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="owner : ${page.content}">
                    <td>
                        <a class="rowlink rowlink--strong" th:href="@{/owners/{id}(id=${owner.id})}"
                           th:text="${owner.lastName} + ', ' + ${owner.firstName}"></a>
                    </td>
                    <td>
                        <a class="rowlink" th:href="@{/owners/{id}(id=${owner.id})}"
                           th:text="${owner.dob} ?: '—'"></a>
                    </td>
                    <td>
                        <a class="rowlink" th:href="@{/owners/{id}(id=${owner.id})}"
                           th:text="${#strings.isEmpty(owner.formattedAddress)} ? '—' : ${owner.formattedAddress}"></a>
                    </td>
                    <td class="table__actions" th:if="${canEdit}">
                        <div class="row-actions" th:if="${canEdit}">
                            <a class="button button--quiet button--small"
                               th:href="@{/owners/{id}(id=${owner.id}, edit=1)}" th:if="${canEdit}">Edit</a>
                            <form th:action="@{/owners/{id}/delete(id=${owner.id})}" method="post"
                                  onsubmit="return confirm('Delete this owner and remove them from every group?');">
                                <button class="button button--danger button--small" type="submit">Delete</button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="empty" th:if="${page.isEmpty()}">
            <p class="empty__title">No owners found</p>
            <p class="empty__hint" th:if="${lastName != null and !lastName.isBlank()}">
                Try a shorter search term.
            </p>
        </div>
    </section>

    <nav class="pagination" th:if="${page.totalPages > 1}">
        <a class="button button--quiet"
           th:if="${page.hasPrevious()}"
           th:href="@{/owners(page=${page.number - 1}, size=${page.size}, lastName=${lastName})}">Previous</a>
        <span th:unless="${page.hasPrevious()}"></span>

        <span class="pagination__status"
              th:text="'Page ' + (${page.number} + 1) + ' of ' + ${page.totalPages}">Page 1 of 1</span>

        <a class="button button--quiet"
           th:if="${page.hasNext()}"
           th:href="@{/owners(page=${page.number + 1}, size=${page.size}, lastName=${lastName})}">Next</a>
        <span th:unless="${page.hasNext()}"></span>
    </nav>

</main>

<div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>

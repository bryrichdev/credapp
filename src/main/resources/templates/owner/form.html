<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add owner &middot; CredApp</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<div th:replace="~{fragments/layout :: topbar(${user}, 'owners')}"></div>

<main class="page">

    <a class="backlink" th:href="@{/owners}">&larr; All owners</a>

    <div class="page__header">
        <h1>Add owner</h1>
        <p class="page__subtitle">First and last name are required. A group can be added now or later.</p>
    </div>

    <section class="card">
        <form th:action="@{/owners}" th:object="${form}" method="post">

            <div class="form-grid">
                <label class="field">
                    <span class="field__label">First name</span>
                    <input class="field__input" type="text" th:field="*{firstName}"
                           th:classappend="${#fields.hasErrors('firstName')} ? 'field__input--invalid'">
                    <span class="field__error" th:if="${#fields.hasErrors('firstName')}"
                          th:errors="*{firstName}"></span>
                </label>

                <label class="field">
                    <span class="field__label">Last name</span>
                    <input class="field__input" type="text" th:field="*{lastName}"
                           th:classappend="${#fields.hasErrors('lastName')} ? 'field__input--invalid'">
                    <span class="field__error" th:if="${#fields.hasErrors('lastName')}"
                          th:errors="*{lastName}"></span>
                </label>

                <label class="field">
                    <span class="field__label">Date of birth</span>
                    <input class="field__input" type="date" th:field="*{dob}">
                </label>

                <label class="field">
                    <span class="field__label">SSN</span>
                    <input class="field__input" type="text" inputmode="numeric" autocomplete="off"
                           th:field="*{ssn}"
                           th:classappend="${#fields.hasErrors('ssn')} ? 'field__input--invalid'"
                           placeholder="9 digits">
                    <span class="field__error" th:if="${#fields.hasErrors('ssn')}" th:errors="*{ssn}"></span>
                </label>

                <label class="field field--wide">
                    <span class="field__label">Street</span>
                    <input class="field__input" type="text" th:field="*{street1}">
                </label>

                <label class="field field--wide">
                    <span class="field__label">Street 2</span>
                    <input class="field__input" type="text" th:field="*{street2}"
                           placeholder="Apt, suite, unit">
                </label>

                <label class="field">
                    <span class="field__label">City</span>
                    <input class="field__input" type="text" th:field="*{city}">
                </label>

                <label class="field">
                    <span class="field__label">State</span>
                    <input class="field__input" type="text" th:field="*{state}"
                           th:classappend="${#fields.hasErrors('state')} ? 'field__input--invalid'"
                           maxlength="2" placeholder="MI">
                    <span class="field__error" th:if="${#fields.hasErrors('state')}" th:errors="*{state}"></span>
                </label>

                <label class="field">
                    <span class="field__label">ZIP</span>
                    <input class="field__input" type="text" th:field="*{zipCode}"
                           th:classappend="${#fields.hasErrors('zipCode')} ? 'field__input--invalid'"
                           placeholder="49425">
                    <span class="field__error" th:if="${#fields.hasErrors('zipCode')}" th:errors="*{zipCode}"></span>
                </label>

                <label class="field">
                    <span class="field__label">Group</span>
                    <select class="field__input" th:field="*{groupId}">
                        <option th:value="''">No group yet</option>
                        <option th:each="option : ${groups}"
                                th:value="${option.id}"
                                th:text="${option.lbn}"></option>
                    </select>
                </label>

                <label class="field">
                    <span class="field__label">Percent owned</span>
                    <input class="field__input" type="number" step="0.01" min="0.01" max="100"
                           th:field="*{percentOwned}"
                           th:classappend="${#fields.hasErrors('percentOwned')} ? 'field__input--invalid'"
                           placeholder="Only if a group is picked">
                    <span class="field__error" th:errors="*{percentOwned}"
                          th:if="${#fields.hasErrors('percentOwned')}"></span>
                </label>
            </div>

            <div class="form-actions">
                <button class="button" type="submit">Save owner</button>
                <a class="button button--quiet" th:href="@{/owners}">Cancel</a>
            </div>
        </form>
    </section>

</main>

<div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>

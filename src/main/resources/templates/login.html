<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in &middot; CredCloud</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="icon" th:href="@{/favicon.ico}" sizes="any">
    <link rel="icon" th:href="@{/favicon.svg}" type="image/svg+xml">
    <link rel="apple-touch-icon" th:href="@{/apple-touch-icon.png}">
</head>
<body class="signin">

<main class="signin__card">
    <div class="signin__brand">
        <span class="topbar__mark">CC</span>
        <span class="topbar__brand">CredCloud</span>
    </div>

    <h1 class="signin__title">Sign in</h1>
    <p class="signin__hint">Credentialing workspace</p>

    <div class="alert alert--error" th:if="${param.error}">
        Unable to sign in. Check your email and password. New coordinators must be approved by their group's admin.
    </div>
    <div class="alert alert--info" th:if="${message}" th:text="${message}"></div>
    <div class="alert alert--info" th:if="${param.logout}">
        You have been signed out.
    </div>

    <form th:action="@{/login}" method="post">
        <label class="field">
            <span class="field__label">Email</span>
            <input class="field__input" type="email" name="username" autocomplete="username" required autofocus>
        </label>

        <label class="field">
            <span class="field__label">Password</span>
            <input class="field__input" type="password" name="password" autocomplete="current-password" required>
        </label>

        <button class="button button--block" type="submit">Sign in</button>
    </form>
    <p class="signin__hint signin__footer">New to CredCloud? <a th:href="@{/register}">Create account</a></p>
</main>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Expiring licenses &middot; CredApp</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<div th:replace="~{fragments/layout :: topbar(${user}, 'expiring')}"></div>

<main class="page">

    <div class="page__header">
        <h1>Expiring licenses</h1>
        <p class="page__subtitle"
           th:text="${licenses.size()} + ' active license(s) expiring within ' + ${days} + ' days'">
            0 licenses
        </p>
    </div>

    <nav class="filters">
        <span class="filters__label">Window</span>
        <a class="filter-chip" th:each="option : ${#arrays.toIntegerArray({30, 60, 90, 180})}"
           th:href="@{/licenses/expiring(days=${option})}"
           th:classappend="${option == days} ? 'filter-chip--active'"
           th:text="${option} + ' days'">30 days</a>
    </nav>

    <section class="card card--flush">
        <table class="table" th:unless="${licenses.isEmpty()}">
            <thead>
            <tr>
                <th>Provider</th>
                <th>State</th>
                <th>Number</th>
                <th>Type</th>
                <th>Expires</th>
                <th>Urgency</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="license : ${licenses}">
                <td>
                    <a class="rowlink rowlink--strong" th:href="@{/providers/{id}(id=${license.provider.id})}"
                       th:text="${license.provider.lastName} + ', ' + ${license.provider.firstName}"></a>
                </td>
                <td>
                    <a class="rowlink" th:href="@{/providers/{id}(id=${license.provider.id})}"
                       th:text="${license.state}"></a>
                </td>
                <td>
                    <a class="rowlink" th:href="@{/providers/{id}(id=${license.provider.id})}"
                       th:text="${license.licenseNumber}"></a>
                </td>
                <td>
                    <a class="rowlink" th:href="@{/providers/{id}(id=${license.provider.id})}"
                       th:text="${license.licenseType}"></a>
                </td>
                <td>
                    <a class="rowlink" th:href="@{/providers/{id}(id=${license.provider.id})}"
                       th:text="${license.expirationDate}"></a>
                </td>
                <td>
                    <span class="badge badge--alert"
                          th:if="${license.expirationDate.isBefore(today.plusDays(30))}">Within 30 days</span>
                    <span class="badge badge--pending"
                          th:if="${license.expirationDate.isBefore(today.plusDays(90))
                                  and !license.expirationDate.isBefore(today.plusDays(30))}">Within 90 days</span>
                    <span class="badge badge--inactive"
                          th:unless="${license.expirationDate.isBefore(today.plusDays(90))}">Later</span>
                </td>
            </tr>
            </tbody>
        </table>

        <div class="empty" th:if="${licenses.isEmpty()}">
            <p class="empty__title">Nothing expiring in this window</p>
            <p class="empty__hint">Try a longer window above.</p>
        </div>
    </section>

</main>

</body>
</html>

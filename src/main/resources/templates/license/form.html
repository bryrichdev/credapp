<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${licenseId} != null ? 'Edit license · CredApp' : 'Add license · CredApp'">Add license</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<div th:replace="~{fragments/layout :: topbar(${user}, 'licenses')}"></div>

<main class="page">

    <a class="backlink" th:href="@{/providers/{id}(id=${provider.id})}">&larr; Back to provider</a>

    <div class="page__header">
        <h1 th:text="${licenseId} != null ? 'Edit license' : 'Add license'">Add license</h1>
    </div>

    <section class="card">
        <p class="context-line">
            For
            <strong th:text="${provider.firstName} + ' ' + ${provider.lastName}"></strong>
        </p>

        <form th:object="${form}" method="post"
              th:action="${licenseId} != null
                  ? @{/providers/{pid}/licenses/{lid}/edit(pid=${provider.id}, lid=${licenseId})}
                  : @{/providers/{pid}/licenses(pid=${provider.id})}">

            <div class="form-grid">
                <label class="field">
                    <span class="field__label">State</span>
                    <input class="field__input" type="text" maxlength="2" th:field="*{state}"
                           th:classappend="${#fields.hasErrors('state')} ? 'field__input--invalid'"
                           placeholder="UT">
                    <span class="field__error" th:if="${#fields.hasErrors('state')}" th:errors="*{state}"></span>
                </label>

                <label class="field">
                    <span class="field__label">License number</span>
                    <input class="field__input" type="text" th:field="*{licenseNumber}"
                           th:classappend="${#fields.hasErrors('licenseNumber')} ? 'field__input--invalid'">
                    <span class="field__error" th:if="${#fields.hasErrors('licenseNumber')}"
                          th:errors="*{licenseNumber}"></span>
                </label>

                <label class="field">
                    <span class="field__label">License type</span>
                    <input class="field__input" type="text" th:field="*{licenseType}"
                           th:classappend="${#fields.hasErrors('licenseType')} ? 'field__input--invalid'"
                           placeholder="MD">
                    <span class="field__error" th:if="${#fields.hasErrors('licenseType')}"
                          th:errors="*{licenseType}"></span>
                </label>

                <label class="field">
                    <span class="field__label">Status</span>
                    <select class="field__input" th:field="*{status}">
                        <option th:each="option : ${statuses}"
                                th:value="${option}"
                                th:text="${option.value}"></option>
                    </select>
                    <span class="field__error" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></span>
                </label>

                <label class="field">
                    <span class="field__label">Issue date</span>
                    <input class="field__input" type="date" th:field="*{issueDate}">
                </label>

                <label class="field">
                    <span class="field__label">Expiration date</span>
                    <input class="field__input" type="date" th:field="*{expirationDate}"
                           th:classappend="${#fields.hasErrors('expirationDate')} ? 'field__input--invalid'">
                    <span class="field__error" th:if="${#fields.hasErrors('expirationDate')}"
                          th:errors="*{expirationDate}"></span>
                </label>

                <label class="field field--wide">
                    <span class="field__label">Restrictions</span>
                    <input class="field__input" type="text" th:field="*{restrictions}"
                           placeholder="Leave blank if none">
                </label>
            </div>

            <div class="form-actions">
                <button class="button" type="submit" th:text="${licenseId} != null ? 'Save changes' : 'Save license'">Save license</button>
                <a class="button button--quiet" th:href="@{/providers/{id}(id=${provider.id})}">Cancel</a>
            </div>
        </form>
    </section>

</main>

</body>
</html>

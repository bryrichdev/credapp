<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title th:text="${chargeId} != null ? 'Edit charge · CredApp' : 'Add charge · CredApp'">Add charge</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<div th:replace="~{fragments/layout :: topbar(${user}, 'providers')}"></div>

<main class="page">

    <a class="backlink" th:href="@{/providers/{id}(id=${provider.id})}">&larr; Back to provider</a>

    <div class="page__header">
        <h1 th:text="${chargeId} != null ? 'Edit charge' : 'Add charge'">Add charge</h1>
    </div>

    <section class="card">
        <p class="context-line">
            For <strong th:text="${provider.firstName} + ' ' + ${provider.lastName}"></strong>
        </p>

        <form method="post" th:action="${chargeId != null}
                ? @{/providers/{pid}/charges/{cid}/edit(pid=${provider.id}, cid=${chargeId})}
                : @{/providers/{pid}/charges(pid=${provider.id})}"
              th:object="${form}">

            <div class="form-grid">
                <label class="field">
                    <span class="field__label">Classification</span>
                    <select class="field__input" th:field="*{classification}">
                        <option value="">Select</option>
                        <option th:each="option : ${classifications}"
                                th:value="${option}" th:text="${option.value}"></option>
                    </select>
                    <span class="field__error" th:if="${#fields.hasErrors('classification')}" th:errors="*{classification}"></span>
                </label>

                <label class="field">
                    <span class="field__label">Status</span>
                    <select class="field__input" th:field="*{status}">
                        <option value="">Select</option>
                        <option th:each="option : ${chargeStatuses}"
                                th:value="${option}" th:text="${option.value}"></option>
                    </select>
                    <span class="field__error" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></span>
                </label>

                <label class="field">
                    <span class="field__label">Incident date</span>
                    <input class="field__input" type="date" th:field="*{incidentDate}">
                </label>

                <label class="field">
                    <span class="field__label">Date of filing</span>
                    <input class="field__input" type="date" th:field="*{dateOfFiling}"
                           th:classappend="${#fields.hasErrors('dateOfFiling')} ? 'field__input--invalid'">
                    <span class="field__error" th:if="${#fields.hasErrors('dateOfFiling')}" th:errors="*{dateOfFiling}"></span>
                </label>

                <label class="field">
                    <span class="field__label">Case number</span>
                    <input class="field__input" type="text" th:field="*{caseNumber}">
                </label>

                <label class="field">
                    <span class="field__label">Court</span>
                    <input class="field__input" type="text" th:field="*{court}">
                </label>

                <label class="field field--wide">
                    <span class="field__label">Statutory citation</span>
                    <input class="field__input" type="text" th:field="*{statutoryCitation}">
                </label>

                <label class="field field--wide">
                    <span class="field__label">Sentencing terms</span>
                    <input class="field__input" type="text" th:field="*{sentencingTerms}"
                           placeholder="Probation, fines, conditions">
                </label>
            </div>

            <div class="form-actions">
                <button class="button" type="submit"
                        th:text="${chargeId} != null ? 'Save changes' : 'Save charge'">Save charge</button>
                <a class="button button--quiet" th:href="@{/providers/{id}(id=${provider.id})}">Cancel</a>
            </div>
        </form>
    </section>

</main>

<div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>

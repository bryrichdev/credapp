<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title th:text="${assignedLocationId} != null ? 'Edit location · CredApp' : 'Add location · CredApp'">Add location</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<div th:replace="~{fragments/layout :: topbar(${user}, 'providers')}"></div>

<main class="page">

    <a class="backlink" th:href="@{/providers/{id}(id=${provider.id})}">&larr; Back to provider</a>

    <div class="page__header">
        <h1 th:text="${assignedLocationId} != null ? 'Edit location' : 'Add location'">Add location</h1>
    </div>

    <section class="card">
        <p class="context-line">
            For <strong th:text="${provider.firstName} + ' ' + ${provider.lastName}"></strong>
        </p>

        <div class="empty" th:if="${assignableLocations.isEmpty()}">
            <p class="empty__title">No locations available</p>
            <p class="empty__hint">
                A provider can only be placed at locations of a group they belong to. Add them to a group first.
            </p>
        </div>

        <form method="post" th:unless="${assignableLocations.isEmpty()}"
              th:action="${assignedLocationId != null}
                ? @{/providers/{pid}/locations/{lid}/edit(pid=${provider.id}, lid=${assignedLocationId})}
                : @{/providers/{pid}/locations(pid=${provider.id})}"
              th:object="${form}">

            <div class="form-grid">
                <label class="field field--wide" th:if="${assignedLocationId == null}">
                    <span class="field__label">Location</span>
                    <select class="field__input" th:field="*{locationId}"
                            th:classappend="${#fields.hasErrors('locationId')} ? 'field__input--invalid'">
                        <option value="">Select a location</option>
                        <option th:each="option : ${assignableLocations}"
                                th:value="${option.id}"
                                th:text="${option.group.lbn} + ' — ' + ${option.locationName}"></option>
                    </select>
                    <span class="field__error" th:if="${#fields.hasErrors('locationId')}" th:errors="*{locationId}"></span>
                </label>

                <!-- Editing an assignment changes only the role; the pairing itself is the key. -->
                <div class="field field--wide" th:if="${assignedLocationId != null}">
                    <span class="field__label">Location</span>
                    <p class="context-line" th:each="option : ${assignableLocations}"
                       th:if="${option.id == assignedLocationId}"
                       th:text="${option.group.lbn} + ' — ' + ${option.locationName}"></p>
                    <input type="hidden" th:field="*{locationId}">
                </div>

                <label class="field">
                    <span class="field__label">PCP or SCP</span>
                    <select class="field__input" th:field="*{pcpScp}">
                        <option value="">Select</option>
                        <option th:each="option : ${pcpScpOptions}"
                                th:value="${option}" th:text="${option.value}"></option>
                    </select>
                    <span class="field__error" th:if="${#fields.hasErrors('pcpScp')}" th:errors="*{pcpScp}"></span>
                </label>
            </div>

            <div class="form-actions">
                <button class="button" type="submit"
                        th:text="${assignedLocationId} != null ? 'Save changes' : 'Save location'">Save location</button>
                <a class="button button--quiet" th:href="@{/providers/{id}(id=${provider.id})}">Cancel</a>
            </div>
        </form>
    </section>

</main>

<div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>

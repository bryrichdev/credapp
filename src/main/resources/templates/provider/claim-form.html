<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title th:text="${claimId} != null ? 'Edit claim · CredApp' : 'Add claim · CredApp'">Add claim</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<div th:replace="~{fragments/layout :: topbar(${user}, 'providers')}"></div>

<main class="page">

    <a class="backlink" th:href="@{/providers/{id}(id=${provider.id})}">&larr; Back to provider</a>

    <div class="page__header">
        <h1 th:text="${claimId} != null ? 'Edit claim' : 'Add claim'">Add claim</h1>
    </div>

    <section class="card">
        <p class="context-line">
            For <strong th:text="${provider.firstName} + ' ' + ${provider.lastName}"></strong>
        </p>

        <form method="post" th:action="${claimId != null}
                ? @{/providers/{pid}/claims/{cid}/edit(pid=${provider.id}, cid=${claimId})}
                : @{/providers/{pid}/claims(pid=${provider.id})}"
              th:object="${form}">

            <div class="form-grid">
                <label class="field">
                    <span class="field__label">Claim number</span>
                    <input class="field__input" type="text" th:field="*{claimNumber}"
                           th:classappend="${#fields.hasErrors('claimNumber')} ? 'field__input--invalid'">
                    <span class="field__error" th:if="${#fields.hasErrors('claimNumber')}" th:errors="*{claimNumber}"></span>
                </label>

                <label class="field">
                    <span class="field__label">Carrier</span>
                    <input class="field__input" type="text" th:field="*{carrierName}"
                           th:classappend="${#fields.hasErrors('carrierName')} ? 'field__input--invalid'">
                    <span class="field__error" th:if="${#fields.hasErrors('carrierName')}" th:errors="*{carrierName}"></span>
                </label>

                <label class="field field--wide" th:if="${claimId == null}">
                    <span class="field__label">Policy</span>
                    <select class="field__input" th:field="*{policyId}">
                        <option value="">Not linked to a policy on file</option>
                        <option th:each="option : ${policies}"
                                th:value="${option.id}"
                                th:text="${option.carrierName} + ' — ' + ${option.policyNumber}"></option>
                    </select>
                    <span class="field__hint">Claims often surface from a carrier before the policy is recorded</span>
                </label>

                <label class="field field--wide">
                    <span class="field__label">Outcome</span>
                    <input class="field__input" type="text" th:field="*{outcome}"
                           placeholder="Settled, dismissed, pending">
                </label>
            </div>

            <div class="form-actions">
                <button class="button" type="submit"
                        th:text="${claimId} != null ? 'Save changes' : 'Save claim'">Save claim</button>
                <a class="button button--quiet" th:href="@{/providers/{id}(id=${provider.id})}">Cancel</a>
            </div>
        </form>
    </section>

</main>

<div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>

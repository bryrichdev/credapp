<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title th:text="${certificationId} != null ? 'Edit certification · CredApp' : 'Add certification · CredApp'">Add certification</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<div th:replace="~{fragments/layout :: topbar(${user}, 'providers')}"></div>

<main class="page">

    <a class="backlink" th:href="@{/providers/{id}(id=${provider.id})}">&larr; Back to provider</a>

    <div class="page__header">
        <h1 th:text="${certificationId} != null ? 'Edit certification' : 'Add certification'">Add certification</h1>
    </div>

    <section class="card">
        <p class="context-line">
            For <strong th:text="${provider.firstName} + ' ' + ${provider.lastName}"></strong>
        </p>

        <form method="post" th:action="${certificationId != null}
                ? @{/providers/{pid}/certifications/{cid}/edit(pid=${provider.id}, cid=${certificationId})}
                : @{/providers/{pid}/certifications(pid=${provider.id})}"
              th:object="${form}">

            <div class="form-grid">
                <label class="field field--wide">
                    <span class="field__label">Board</span>
                    <input class="field__input" type="text" th:field="*{board}"
                           th:classappend="${#fields.hasErrors('board')} ? 'field__input--invalid'"
                           placeholder="American Board of Family Medicine">
                    <span class="field__error" th:if="${#fields.hasErrors('board')}" th:errors="*{board}"></span>
                </label>

                <label class="field">
                    <span class="field__label">Effective date</span>
                    <input class="field__input" type="date" th:field="*{effectiveDate}"
                           th:classappend="${#fields.hasErrors('effectiveDate')} ? 'field__input--invalid'">
                    <span class="field__error" th:if="${#fields.hasErrors('effectiveDate')}" th:errors="*{effectiveDate}"></span>
                </label>

                <label class="field">
                    <span class="field__label">Expiration date</span>
                    <input class="field__input" type="date" th:field="*{expirationDate}"
                           th:classappend="${#fields.hasErrors('expirationDate')} ? 'field__input--invalid'">
                    <span class="field__hint">Leave blank for a lifetime certification</span>
                    <span class="field__error" th:if="${#fields.hasErrors('expirationDate')}" th:errors="*{expirationDate}"></span>
                </label>
            </div>

            <div class="form-actions">
                <button class="button" type="submit"
                        th:text="${certificationId} != null ? 'Save changes' : 'Save certification'">Save certification</button>
                <a class="button button--quiet" th:href="@{/providers/{id}(id=${provider.id})}">Cancel</a>
            </div>
        </form>
    </section>

</main>

<div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>

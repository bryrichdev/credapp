<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title th:text="${locationId} != null ? 'Edit location · CredApp' : 'Add location · CredApp'">Add location</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<div th:replace="~{fragments/layout :: topbar(${user}, 'groups')}"></div>

<main class="page">

    <a class="backlink" th:href="@{/groups/{id}(id=${group.id})}">&larr; Back to group</a>

    <div class="page__header">
        <h1 th:text="${locationId} != null ? 'Edit location' : 'Add location'">Add location</h1>
    </div>

    <section class="card">
        <p class="context-line">
            For
            <strong th:text="${group.lbn}"></strong>
        </p>

        <form method="post" th:action="${locationId != null}
                ? @{/groups/{gid}/locations/{lid}/edit(gid=${group.id}, lid=${locationId})}
                : @{/groups/{gid}/locations(gid=${group.id})}"
              th:object="${form}">

            <div class="form-grid">
                <label class="field">
                    <span class="field__label">Location name</span>
                    <input class="field__input" type="text" th:field="*{locationName}"
                           th:classappend="${#fields.hasErrors('locationName')} ? 'field__input--invalid'">
                    <span class="field__error" th:errors="*{locationName}"
                          th:if="${#fields.hasErrors('locationName')}"></span>
                </label>

                <label class="field">
                    <span class="field__label">Phone</span>
                    <input class="field__input" type="tel" th:field="*{phoneNumber}">
                </label>

                <label class="field field--wide">
                    <span class="field__label">Address</span>
                    <input class="field__input" type="text" th:field="*{address}"
                           th:classappend="${#fields.hasErrors('address')} ? 'field__input--invalid'">
                    <span class="field__error" th:errors="*{address}"
                          th:if="${#fields.hasErrors('address')}"></span>
                </label>

                <label class="field">
                    <span class="field__label">Fax</span>
                    <input class="field__input" type="tel" th:field="*{faxNumber}">
                </label>

                <label class="field">
                    <span class="field__label">Handicap access</span>
                    <input class="field__input" type="text" th:field="*{handicapAccess}"
                           placeholder="e.g. Ramp and elevator">
                </label>

                <label class="field field--wide">
                    <span class="field__label">Languages</span>
                    <input class="field__input" type="text" th:field="*{languages}"
                           placeholder="e.g. English, Spanish">
                </label>
            </div>

            <div class="form-actions">
                <button class="button" type="submit"
                        th:text="${locationId} != null ? 'Save changes' : 'Save location'">Save location</button>
                <a class="button button--quiet" th:href="@{/groups/{id}(id=${group.id})}">Cancel</a>
            </div>
        </form>
    </section>

</main>

<div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>

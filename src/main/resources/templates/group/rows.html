<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body>

<!--
    One fragment per repeatable row on the group form. Each takes:
      p    - the name prefix, such as locations[0]
      row  - the object to show
      live - false for the blank copy inside a <template>, which skips error lookups
    The page script renumbers the [n] in every name after a row is added or removed.
-->

<!-- ============ location ============ -->
<div class="row-card" data-row th:fragment="location(p, row, live)">
    <button class="button button--quiet button--small row-card__remove" type="button" data-remove-row
            aria-label="Remove this row">Remove</button>
    <input type="hidden" th:name="${p + '.id'}" th:value="${row.id}">
    <div class="form-grid">
        <label class="field">
            <span class="field__label">Location name</span>
            <input class="field__input" type="text" th:name="${p + '.locationName'}" th:value="${row.locationName}"
                    th:classappend="${live and #fields.hasErrors(p + '.locationName')} ? 'field__input--invalid'">
            <span th:replace="~{fragments/rows :: err(${p + '.locationName'}, ${live})}"></span>
        </label>
        <label class="field">
            <span class="field__label">Phone</span>
            <input class="field__input" type="tel" th:name="${p + '.phoneNumber'}" th:value="${row.phoneNumber}"
                    th:classappend="${live and #fields.hasErrors(p + '.phoneNumber')} ? 'field__input--invalid'">
            <span th:replace="~{fragments/rows :: err(${p + '.phoneNumber'}, ${live})}"></span>
        </label>
        <label class="field field--wide">
            <span class="field__label">Address</span>
            <input class="field__input" type="text" th:name="${p + '.address'}" th:value="${row.address}"
                    th:classappend="${live and #fields.hasErrors(p + '.address')} ? 'field__input--invalid'">
            <span th:replace="~{fragments/rows :: err(${p + '.address'}, ${live})}"></span>
        </label>
        <div class="field field--wide"><span class="field__hint">For automated applications, enter the address components below. These replace the full address when all required components are present.</span>
            <span th:replace="~{fragments/rows :: err(${p + '.addressComplete'}, ${live})}"></span></div>
        <label class="field"><span class="field__label">Street</span>
            <input class="field__input" type="text" th:name="${p + '.street1'}" th:value="${row.street1}">
            <span th:replace="~{fragments/rows :: err(${p + '.street1'}, ${live})}"></span>
        </label>
        <label class="field"><span class="field__label">Street 2</span>
            <input class="field__input" type="text" th:name="${p + '.street2'}" th:value="${row.street2}">
            <span th:replace="~{fragments/rows :: err(${p + '.street2'}, ${live})}"></span>
        </label>
        <label class="field"><span class="field__label">City</span>
            <input class="field__input" type="text" th:name="${p + '.city'}" th:value="${row.city}">
            <span th:replace="~{fragments/rows :: err(${p + '.city'}, ${live})}"></span>
        </label>
        <label class="field"><span class="field__label">State</span>
            <input class="field__input" type="text" th:name="${p + '.state'}" th:value="${row.state}">
            <span th:replace="~{fragments/rows :: err(${p + '.state'}, ${live})}"></span>
        </label>
        <label class="field"><span class="field__label">ZIP</span>
            <input class="field__input" type="text" th:name="${p + '.zipCode'}" th:value="${row.zipCode}">
            <span th:replace="~{fragments/rows :: err(${p + '.zipCode'}, ${live})}"></span>
        </label>
        <label class="field">
            <span class="field__label">Fax</span>
            <input class="field__input" type="tel" th:name="${p + '.faxNumber'}" th:value="${row.faxNumber}"
                    th:classappend="${live and #fields.hasErrors(p + '.faxNumber')} ? 'field__input--invalid'">
            <span th:replace="~{fragments/rows :: err(${p + '.faxNumber'}, ${live})}"></span>
        </label>
        <label class="field">
            <span class="field__label">Handicap access</span>
            <input class="field__input" type="text" placeholder="e.g. Ramp and elevator" th:name="${p + '.handicapAccess'}" th:value="${row.handicapAccess}"
                    th:classappend="${live and #fields.hasErrors(p + '.handicapAccess')} ? 'field__input--invalid'">
            <span th:replace="~{fragments/rows :: err(${p + '.handicapAccess'}, ${live})}"></span>
        </label>
        <label class="field field--wide">
            <span class="field__label">Languages</span>
            <input class="field__input" type="text" placeholder="e.g. English, Spanish" th:name="${p + '.languages'}" th:value="${row.languages}"
                    th:classappend="${live and #fields.hasErrors(p + '.languages')} ? 'field__input--invalid'">
            <span th:replace="~{fragments/rows :: err(${p + '.languages'}, ${live})}"></span>
        </label>
    </div>
</div>

<!-- ============ owner ============ -->
<div class="row-card" data-row th:fragment="owner(p, row, live)">
    <button class="button button--quiet button--small row-card__remove" type="button" data-remove-row
            aria-label="Remove this row">Remove</button>
    <input type="hidden" th:name="${p + '.key'}" th:value="${row.key}" data-key>
    <div class="form-grid">
        <label class="field">
            <span class="field__label">Owner</span>
            <select class="field__input" data-mode th:name="${p + '.mode'}">
                <option value="existing" th:selected="${row.mode == 'existing'}">Someone already on file</option>
                <option value="new" th:selected="${row.mode == 'new'}">A new owner</option>
            </select>
            <span th:replace="~{fragments/rows :: err(${p + '.mode'}, ${live})}"></span>
        </label>
        <div data-mode-show="existing">
            <label class="field">
                <span class="field__label">Person</span>
                <select class="field__input" data-label-part th:name="${p + '.ownerId'}"
                        th:classappend="${live and #fields.hasErrors(p + '.ownerId')} ? 'field__input--invalid'">
                    <option value="">Select a person</option>
                    <option th:each="o : ${people}" th:value="${o.id}" th:text="${o.lastName + ', ' + o.firstName}"
                            th:selected="${row.ownerId == o.id}"></option>
                </select>
                <span th:replace="~{fragments/rows :: err(${p + '.ownerId'}, ${live})}"></span>
            </label>
        </div>
        <div class="field field--wide" data-mode-show="new">
            <p class="row-card__subhead">New owner's details</p>
            <div class="form-grid">
                <label class="field">
                    <span class="field__label">First name</span>
                    <input class="field__input" type="text" data-label-part th:name="${p + '.newOwner.firstName'}" th:value="${row.newOwner?.firstName}"
                            th:classappend="${live and row.newOwner != null and #fields.hasErrors(p + '.newOwner.firstName')} ? 'field__input--invalid'">
                    <span th:replace="~{fragments/rows :: err(${p + '.newOwner.firstName'}, ${live and row.newOwner != null})}"></span>
                </label>
                <label class="field">
                    <span class="field__label">Last name</span>
                    <input class="field__input" type="text" data-label-part th:name="${p + '.newOwner.lastName'}" th:value="${row.newOwner?.lastName}"
                            th:classappend="${live and row.newOwner != null and #fields.hasErrors(p + '.newOwner.lastName')} ? 'field__input--invalid'">
                    <span th:replace="~{fragments/rows :: err(${p + '.newOwner.lastName'}, ${live and row.newOwner != null})}"></span>
                </label>
                <label class="field">
                    <span class="field__label">Date of birth</span>
                    <input class="field__input" type="date" th:name="${p + '.newOwner.dob'}" th:value="${row.newOwner?.dob}"
                            th:classappend="${live and row.newOwner != null and #fields.hasErrors(p + '.newOwner.dob')} ? 'field__input--invalid'">
                    <span th:replace="~{fragments/rows :: err(${p + '.newOwner.dob'}, ${live and row.newOwner != null})}"></span>
                </label>
                <label class="field">
                    <span class="field__label">SSN</span>
                    <input class="field__input" type="text" inputmode="numeric" autocomplete="off" placeholder="9 digits"
                           th:name="${p + '.newOwner.ssn'}"
                           th:classappend="${live and row.newOwner != null and #fields.hasErrors(p + '.newOwner.ssn')} ? 'field__input--invalid'">
                    <span class="field__hint" th:if="${live and #fields.hasAnyErrors()}">Re-enter after a failed save; it isn't kept on the page.</span>
                    <span th:replace="~{fragments/rows :: err(${p + '.newOwner.ssn'}, ${live and row.newOwner != null})}"></span>
                </label>
                <label class="field field--wide">
                    <span class="field__label">Street</span>
                    <input class="field__input" type="text" th:name="${p + '.newOwner.street1'}" th:value="${row.newOwner?.street1}"
                            th:classappend="${live and row.newOwner != null and #fields.hasErrors(p + '.newOwner.street1')} ? 'field__input--invalid'">
                    <span th:replace="~{fragments/rows :: err(${p + '.newOwner.street1'}, ${live and row.newOwner != null})}"></span>
                </label>
                <label class="field field--wide">
                    <span class="field__label">Street 2</span>
                    <input class="field__input" type="text" placeholder="Apt, suite, unit" th:name="${p + '.newOwner.street2'}" th:value="${row.newOwner?.street2}"
                            th:classappend="${live and row.newOwner != null and #fields.hasErrors(p + '.newOwner.street2')} ? 'field__input--invalid'">
                    <span th:replace="~{fragments/rows :: err(${p + '.newOwner.street2'}, ${live and row.newOwner != null})}"></span>
                </label>
                <label class="field">
                    <span class="field__label">City</span>
                    <input class="field__input" type="text" th:name="${p + '.newOwner.city'}" th:value="${row.newOwner?.city}"
                            th:classappend="${live and row.newOwner != null and #fields.hasErrors(p + '.newOwner.city')} ? 'field__input--invalid'">
                    <span th:replace="~{fragments/rows :: err(${p + '.newOwner.city'}, ${live and row.newOwner != null})}"></span>
                </label>
                <label class="field">
                    <span class="field__label">State</span>
                    <input class="field__input" type="text" maxlength="2" placeholder="MI" th:name="${p + '.newOwner.state'}" th:value="${row.newOwner?.state}"
                            th:classappend="${live and row.newOwner != null and #fields.hasErrors(p + '.newOwner.state')} ? 'field__input--invalid'">
                    <span th:replace="~{fragments/rows :: err(${p + '.newOwner.state'}, ${live and row.newOwner != null})}"></span>
                </label>
                <label class="field">
                    <span class="field__label">ZIP</span>
                    <input class="field__input" type="text" placeholder="49425" th:name="${p + '.newOwner.zipCode'}" th:value="${row.newOwner?.zipCode}"
                            th:classappend="${live and row.newOwner != null and #fields.hasErrors(p + '.newOwner.zipCode')} ? 'field__input--invalid'">
                    <span th:replace="~{fragments/rows :: err(${p + '.newOwner.zipCode'}, ${live and row.newOwner != null})}"></span>
                </label>
            </div>
        </div>
        <label class="field">
            <span class="field__label">Percent owned</span>
            <input class="field__input" type="number" step="0.01" min="0" max="100" th:name="${p + '.percentOwned'}" th:value="${row.percentOwned}"
                    th:classappend="${live and #fields.hasErrors(p + '.percentOwned')} ? 'field__input--invalid'">
            <span th:replace="~{fragments/rows :: err(${p + '.percentOwned'}, ${live})}"></span>
        </label>
        <label class="field">
            <span class="field__label">Effective date</span>
            <input class="field__input" type="date" th:name="${p + '.effectiveDate'}" th:value="${row.effectiveDate}"
                    th:classappend="${live and #fields.hasErrors(p + '.effectiveDate')} ? 'field__input--invalid'">
            <span th:replace="~{fragments/rows :: err(${p + '.effectiveDate'}, ${live})}"></span>
        </label>
    </div>
</div>

<!-- ============ relationship between owners ============ -->
<div class="row-card" data-row th:fragment="relation(p, row, live)">
    <button class="button button--quiet button--small row-card__remove" type="button" data-remove-row
            aria-label="Remove this row">Remove</button>
    <div class="form-grid">
        <label class="field">
            <span class="field__label">Owner</span>
            <select class="field__input" data-link-target="owners" th:name="${p + '.ownerKey'}"
                    th:classappend="${live and #fields.hasErrors(p + '.ownerKey')} ? 'field__input--invalid'">
                <option value="" data-static>Select an owner</option>
                <option th:each="o : ${form.owners}" th:if="${o != null and o.key != null}"
                        th:value="${o.key}" th:text="${ownerLabels[o.key]}"
                        th:selected="${row.ownerKey == o.key}"></option>
            </select>
            <span th:replace="~{fragments/rows :: err(${p + '.ownerKey'}, ${live})}"></span>
        </label>
        <label class="field">
            <span class="field__label">Is the</span>
            <select class="field__input" th:name="${p + '.relationship'}"
                    th:classappend="${live and #fields.hasErrors(p + '.relationship')} ? 'field__input--invalid'">
                <option value="">Select a relationship</option>
                <option th:each="o : ${relationships}" th:value="${o}" th:text="${o.dbValue()}"
                        th:selected="${row.relationship == o}"></option>
            </select>
            <span th:replace="~{fragments/rows :: err(${p + '.relationship'}, ${live})}"></span>
        </label>
        <label class="field">
            <span class="field__label">Of</span>
            <select class="field__input" data-link-target="owners" th:name="${p + '.relatedOwnerKey'}"
                    th:classappend="${live and #fields.hasErrors(p + '.relatedOwnerKey')} ? 'field__input--invalid'">
                <option value="" data-static>Select an owner</option>
                <option th:each="o : ${form.owners}" th:if="${o != null and o.key != null}"
                        th:value="${o.key}" th:text="${ownerLabels[o.key]}"
                        th:selected="${row.relatedOwnerKey == o.key}"></option>
            </select>
            <span th:replace="~{fragments/rows :: err(${p + '.relatedOwnerKey'}, ${live})}"></span>
        </label>
    </div>
</div>

<!-- ============ provider ============ -->
<div class="row-card" data-row th:fragment="provider(p, row, live)">
    <button class="button button--quiet button--small row-card__remove" type="button" data-remove-row
            aria-label="Remove this row">Remove</button>
    <div class="form-grid">
        <label class="field">
            <span class="field__label">Provider</span>
            <select class="field__input" th:name="${p + '.providerId'}"
                    th:classappend="${live and #fields.hasErrors(p + '.providerId')} ? 'field__input--invalid'">
                <option value="">Select a provider</option>
                <option th:each="o : ${providerOptions}" th:value="${o.id}" th:text="${o.lastName + ', ' + o.firstName}"
                        th:selected="${row.providerId == o.id}"></option>
            </select>
            <span th:replace="~{fragments/rows :: err(${p + '.providerId'}, ${live})}"></span>
        </label>
        <label class="field">
            <span class="field__label">Effective date</span>
            <input class="field__input" type="date" th:name="${p + '.effectiveDate'}" th:value="${row.effectiveDate}"
                    th:classappend="${live and #fields.hasErrors(p + '.effectiveDate')} ? 'field__input--invalid'">
            <span th:replace="~{fragments/rows :: err(${p + '.effectiveDate'}, ${live})}"></span>
        </label>
    </div>
</div>

<!-- ============ specialty ============ -->
<div class="row-card" data-row th:fragment="taxonomy(p, row, live)">
    <button class="button button--quiet button--small row-card__remove" type="button" data-remove-row
            aria-label="Remove this row">Remove</button>
    <div class="form-grid">
        <label class="field">
            <span class="field__label">Specialty</span>
            <select class="field__input" th:name="${p + '.code'}"
                    th:classappend="${live and #fields.hasErrors(p + '.code')} ? 'field__input--invalid'">
                <option value="">Select a specialty</option>
                <option th:each="o : ${taxonomyOptions}" th:value="${o.code}" th:text="${o.label}"
                        th:selected="${row.code == o.code}"></option>
            </select>
            <span th:replace="~{fragments/rows :: err(${p + '.code'}, ${live})}"></span>
        </label>
        <div class="field">
            <span class="field__label">Primary</span>
            <label class="check">
                <input type="checkbox" value="true" th:name="${p + '.primary'}" th:checked="${row.primary}" data-primary>
                <span>Primary specialty</span>
            </label>
            <span th:replace="~{fragments/rows :: err(${p + '.primary'}, ${live})}"></span>
        </div>
    </div>
</div>

<!-- ============ malpractice policy ============ -->
<div class="row-card" data-row th:fragment="policy(p, row, live)">
    <button class="button button--quiet button--small row-card__remove" type="button" data-remove-row
            aria-label="Remove this row">Remove</button>
    <input type="hidden" th:name="${p + '.id'}" th:value="${row.id}">
    <div class="form-grid">
        <label class="field">
            <span class="field__label">Carrier</span>
            <input class="field__input" type="text" th:name="${p + '.carrierName'}" th:value="${row.carrierName}"
                    th:classappend="${live and #fields.hasErrors(p + '.carrierName')} ? 'field__input--invalid'">
            <span th:replace="~{fragments/rows :: err(${p + '.carrierName'}, ${live})}"></span>
        </label>
        <label class="field">
            <span class="field__label">Policy number</span>
            <input class="field__input" type="text" th:name="${p + '.policyNumber'}" th:value="${row.policyNumber}"
                    th:classappend="${live and #fields.hasErrors(p + '.policyNumber')} ? 'field__input--invalid'">
            <span th:replace="~{fragments/rows :: err(${p + '.policyNumber'}, ${live})}"></span>
        </label>
        <label class="field">
            <span class="field__label">Type of coverage</span>
            <input class="field__input" type="text" placeholder="Claims-made, occurrence" th:name="${p + '.typeOfCoverage'}" th:value="${row.typeOfCoverage}"
                    th:classappend="${live and #fields.hasErrors(p + '.typeOfCoverage')} ? 'field__input--invalid'">
            <span th:replace="~{fragments/rows :: err(${p + '.typeOfCoverage'}, ${live})}"></span>
        </label>
        <label class="field">
            <span class="field__label">Shared or individual</span>
            <select class="field__input" th:name="${p + '.sharedIndividual'}"
                    th:classappend="${live and #fields.hasErrors(p + '.sharedIndividual')} ? 'field__input--invalid'">
                <option value="">Select</option>
                <option th:each="o : ${scopes}" th:value="${o}" th:text="${o.value}"
                        th:selected="${row.sharedIndividual == o}"></option>
            </select>
            <span th:replace="~{fragments/rows :: err(${p + '.sharedIndividual'}, ${live})}"></span>
        </label>
        <label class="field">
            <span class="field__label">Effective date</span>
            <input class="field__input" type="date" th:name="${p + '.effectiveDate'}" th:value="${row.effectiveDate}"
                    th:classappend="${live and #fields.hasErrors(p + '.effectiveDate')} ? 'field__input--invalid'">
            <span th:replace="~{fragments/rows :: err(${p + '.effectiveDate'}, ${live})}"></span>
        </label>
        <label class="field">
            <span class="field__label">Expiration date</span>
            <input class="field__input" type="date" th:name="${p + '.expirationDate'}" th:value="${row.expirationDate}"
                    th:classappend="${live and #fields.hasErrors(p + '.expirationDate')} ? 'field__input--invalid'">
            <span th:replace="~{fragments/rows :: err(${p + '.expirationDate'}, ${live})}"></span>
            <span th:replace="~{fragments/rows :: err(${p + '.expirationAfterEffective'}, ${live})}"></span>
        </label>
        <label class="field">
            <span class="field__label">Original effective date</span>
            <input class="field__input" type="date" th:name="${p + '.originalEffectiveDate'}" th:value="${row.originalEffectiveDate}"
                    th:classappend="${live and #fields.hasErrors(p + '.originalEffectiveDate')} ? 'field__input--invalid'">
            <span class="field__hint">When coverage with this carrier first began</span>
            <span th:replace="~{fragments/rows :: err(${p + '.originalEffectiveDate'}, ${live})}"></span>
            <span th:replace="~{fragments/rows :: err(${p + '.originalOnOrBeforeEffective'}, ${live})}"></span>
        </label>
        <label class="field">
            <span class="field__label">Coverage per occurrence</span>
            <input class="field__input" type="number" step="0.01" min="0" placeholder="1000000.00" th:name="${p + '.amountOfCoveragePerOccurrence'}" th:value="${row.amountOfCoveragePerOccurrence}"
                    th:classappend="${live and #fields.hasErrors(p + '.amountOfCoveragePerOccurrence')} ? 'field__input--invalid'">
            <span th:replace="~{fragments/rows :: err(${p + '.amountOfCoveragePerOccurrence'}, ${live})}"></span>
        </label>
        <label class="field">
            <span class="field__label">Coverage per aggregate</span>
            <input class="field__input" type="number" step="0.01" min="0" placeholder="3000000.00" th:name="${p + '.amountOfCoveragePerAggregate'}" th:value="${row.amountOfCoveragePerAggregate}"
                    th:classappend="${live and #fields.hasErrors(p + '.amountOfCoveragePerAggregate')} ? 'field__input--invalid'">
            <span th:replace="~{fragments/rows :: err(${p + '.amountOfCoveragePerAggregate'}, ${live})}"></span>
        </label>
    </div>
</div>

<!-- ============ payer enrollment, with the payer's rep for this group ============ -->
<div class="row-card" data-row th:fragment="payer(p, row, live)">
    <button class="button button--quiet button--small row-card__remove" type="button" data-remove-row
            aria-label="Remove this row">Remove</button>
    <div class="form-grid">
        <th:block th:replace="~{fragments/enrollment :: fields(${p}, ${row}, ${live})}"></th:block>
        <label class="field field--wide">
            <span class="field__label">Account rep</span>
            <select class="field__input" data-rep-select th:name="${p + '.accountRepId'}"
                    th:classappend="${live and #fields.hasErrors(p + '.accountRepId')} ? 'field__input--invalid'">
                <option value="" data-static>No designated rep</option>
                <option th:each="o : ${repOptions}" th:value="${o.id}" th:data-payer="${o.payer.id}"
                        th:text="${o.group != null} ? ${o.label} + ' (this group)' : ${o.label}"
                        th:selected="${row.accountRepId == o.id}"></option>
            </select>
            <span class="field__hint">From the payer's contacts. Add the rep there first if they aren't listed.</span>
            <span th:replace="~{fragments/rows :: err(${p + '.accountRepId'}, ${live})}"></span>
        </label>
    </div>
</div>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Groups &middot; CredApp</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<div th:replace="~{fragments/layout :: topbar(${user}, 'groups')}"></div>

<main class="page">

    <div class="page__header page__header--row">
        <div>
        <h1>Groups</h1>
        <p class="page__subtitle">
            <span th:if="${lbn == null or lbn.isBlank()}"
                  th:text="${page.totalElements} + ' group(s)'">0 groups</span>
            <span th:unless="${lbn == null or lbn.isBlank()}"
                  th:text="${page.totalElements} + ' result(s) for &quot;' + ${lbn} + '&quot;'">0 results</span>
        </p>
        </div>
        <a class="button" th:href="@{/groups/new}" th:if="${canEdit}">Add group</a>
    </div>

    <form class="toolbar" th:action="@{/groups}" method="get">
        <input class="field__input toolbar__input"
               type="search"
               name="lbn"
               th:value="${lbn}"
               placeholder="Search by legal business name">
        <button class="button" type="submit">Search</button>
        <a class="button button--quiet"
           th:if="${lbn != null and !lbn.isBlank()}"
           th:href="@{/groups}">Clear</a>
    </form>

    <section class="card card--flush">
        <div class="table-scroll" role="region" tabindex="0" aria-label="Group" th:unless="${page.isEmpty()}">
            <table class="table">
                <thead>
                <tr>
                    <th>Legal business name</th>
                    <th>DBA</th>
                    <th>NPI</th>
                    <th>Tax ID</th>
                    <th class="table__actions" th:if="${canEdit}"></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="group : ${page.content}">
                    <td>
                        <a class="rowlink rowlink--strong" th:href="@{/groups/{id}(id=${group.id})}"
                           th:text="${group.lbn}"></a>
                    </td>
                    <td>
                        <a class="rowlink" th:href="@{/groups/{id}(id=${group.id})}"
                           th:text="${group.dba} ?: '—'"></a>
                    </td>
                    <td>
                        <a class="rowlink" th:href="@{/groups/{id}(id=${group.id})}"
                           th:text="${group.npi} ?: '—'"></a>
                    </td>
                    <td>
                        <a class="rowlink" th:href="@{/groups/{id}(id=${group.id})}"
                           th:text="${group.taxId}"></a>
                    </td>
                    <td class="table__actions" th:if="${canEdit}">
                        <div class="row-actions" th:if="${canEdit}">
                            <a class="button button--quiet button--small"
                               th:href="@{/groups/{id}/edit(id=${group.id})}" th:if="${canEdit}">Edit</a>
                            <form th:action="@{/groups/{id}/delete(id=${group.id})}" method="post"
                                  onsubmit="return confirm('Delete this group, its locations and its ownership records?');">
                                <button class="button button--danger button--small" type="submit">Delete</button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="empty" th:if="${page.isEmpty()}">
            <p class="empty__title">No groups found</p>
            <p class="empty__hint" th:if="${lbn != null and !lbn.isBlank()}">
                Try a shorter search term.
            </p>
        </div>
    </section>

    <nav class="pagination" th:if="${page.totalPages > 1}">
        <a class="button button--quiet"
           th:if="${page.hasPrevious()}"
           th:href="@{/groups(page=${page.number - 1}, size=${page.size}, lbn=${lbn})}">Previous</a>
        <span th:unless="${page.hasPrevious()}"></span>

        <span class="pagination__status"
              th:text="'Page ' + (${page.number} + 1) + ' of ' + ${page.totalPages}">Page 1 of 1</span>

        <a class="button button--quiet"
           th:if="${page.hasNext()}"
           th:href="@{/groups(page=${page.number + 1}, size=${page.size}, lbn=${lbn})}">Next</a>
        <span th:unless="${page.hasNext()}"></span>
    </nav>

</main>

<div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>

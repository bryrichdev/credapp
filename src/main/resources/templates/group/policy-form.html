<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title th:text="${policyId} != null ? 'Edit policy · CredApp' : 'Add policy · CredApp'">Add policy</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<div th:replace="~{fragments/layout :: topbar(${user}, 'groups')}"></div>

<main class="page">

    <a class="backlink" th:href="@{/groups/{id}(id=${group.id})}">&larr; Back to group</a>

    <div class="page__header">
        <h1 th:text="${policyId} != null ? 'Edit policy' : 'Add policy'">Add policy</h1>
    </div>

    <section class="card">
        <p class="context-line">
            For <strong th:text="${group.lbn}"></strong>
        </p>

        <form method="post" th:action="${policyId != null}
                ? @{/groups/{gid}/policies/{mid}/edit(gid=${group.id}, mid=${policyId})}
                : @{/groups/{gid}/policies(gid=${group.id})}"
              th:object="${form}">

            <input type="hidden" th:field="*{groupId}">

            <div class="form-grid">
                <label class="field">
                    <span class="field__label">Policy number</span>
                    <input class="field__input" type="text" th:field="*{policyNumber}"
                           th:classappend="${#fields.hasErrors('policyNumber')} ? 'field__input--invalid'">
                    <span class="field__error" th:if="${#fields.hasErrors('policyNumber')}" th:errors="*{policyNumber}"></span>
                </label>

                <label class="field">
                    <span class="field__label">Carrier</span>
                    <input class="field__input" type="text" th:field="*{carrierName}"
                           th:classappend="${#fields.hasErrors('carrierName')} ? 'field__input--invalid'">
                    <span class="field__error" th:if="${#fields.hasErrors('carrierName')}" th:errors="*{carrierName}"></span>
                </label>

                <label class="field">
                    <span class="field__label">Type of coverage</span>
                    <input class="field__input" type="text" th:field="*{typeOfCoverage}"
                           th:classappend="${#fields.hasErrors('typeOfCoverage')} ? 'field__input--invalid'"
                           placeholder="Claims-made, occurrence">
                    <span class="field__error" th:if="${#fields.hasErrors('typeOfCoverage')}" th:errors="*{typeOfCoverage}"></span>
                </label>

                <label class="field">
                    <span class="field__label">Shared or individual</span>
                    <select class="field__input" th:field="*{sharedIndividual}">
                        <option value="">Select</option>
                        <option th:each="option : ${scopes}"
                                th:value="${option}" th:text="${option.value}"></option>
                    </select>
                    <span class="field__error" th:if="${#fields.hasErrors('sharedIndividual')}" th:errors="*{sharedIndividual}"></span>
                </label>

                <label class="field">
                    <span class="field__label">Effective date</span>
                    <input class="field__input" type="date" th:field="*{effectiveDate}"
                           th:classappend="${#fields.hasErrors('effectiveDate')} ? 'field__input--invalid'">
                    <span class="field__error" th:if="${#fields.hasErrors('effectiveDate')}" th:errors="*{effectiveDate}"></span>
                </label>

                <label class="field">
                    <span class="field__label">Expiration date</span>
                    <input class="field__input" type="date" th:field="*{expirationDate}"
                           th:classappend="${#fields.hasErrors('expirationDate')} ? 'field__input--invalid'">
                    <span class="field__error" th:if="${#fields.hasErrors('expirationDate')}" th:errors="*{expirationDate}"></span>
                </label>

                <label class="field">
                    <span class="field__label">Original effective date</span>
                    <input class="field__input" type="date" th:field="*{originalEffectiveDate}"
                           th:classappend="${#fields.hasErrors('originalEffectiveDate')} ? 'field__input--invalid'">
                    <span class="field__hint">When coverage with this carrier first began</span>
                    <span class="field__error" th:if="${#fields.hasErrors('originalEffectiveDate')}" th:errors="*{originalEffectiveDate}"></span>
                </label>

                <label class="field">
                    <span class="field__label">Coverage per occurrence</span>
                    <input class="field__input" type="number" step="0.01" min="0"
                           th:field="*{amountOfCoveragePerOccurrence}"
                           th:classappend="${#fields.hasErrors('amountOfCoveragePerOccurrence')} ? 'field__input--invalid'"
                           placeholder="1000000.00">
                    <span class="field__error" th:if="${#fields.hasErrors('amountOfCoveragePerOccurrence')}" th:errors="*{amountOfCoveragePerOccurrence}"></span>
                </label>

                <label class="field">
                    <span class="field__label">Coverage per aggregate</span>
                    <input class="field__input" type="number" step="0.01" min="0"
                           th:field="*{amountOfCoveragePerAggregate}"
                           th:classappend="${#fields.hasErrors('amountOfCoveragePerAggregate')} ? 'field__input--invalid'"
                           placeholder="3000000.00">
                    <span class="field__error" th:if="${#fields.hasErrors('amountOfCoveragePerAggregate')}" th:errors="*{amountOfCoveragePerAggregate}"></span>
                </label>
            </div>

            <div class="form-actions">
                <button class="button" type="submit"
                        th:text="${policyId} != null ? 'Save changes' : 'Save policy'">Save policy</button>
                <a class="button button--quiet" th:href="@{/groups/{id}(id=${group.id})}">Cancel</a>
            </div>
        </form>
    </section>

</main>

<div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CredCloud Runner</title>
    <link rel="stylesheet" href="/css/app.css">
    <link rel="icon" href="/favicon.ico">
</head>
<body>
<!-- The runner's own tab. It makes its API calls from here, and shows what it's doing. -->
<main class="page">
    <div class="page__header">
        <h1>CredCloud Runner</h1>
        <p class="page__subtitle">Keep this tab open. The runner fills payer portals in other tabs and never submits them.</p>
    </div>
    <section class="card">
        <h2>Status</h2>
        <p id="runner-status" data-state="starting">Starting…</p>
        <p class="field__hint" id="runner-missing">If this never changes, the runner isn't running. Start CredCloud Runner on this computer.</p>
    </section>
    <section class="card" id="runner-pair" hidden>
        <h2>Connect this computer</h2>
        <form id="runner-pair-form">
            <div class="form-grid">
                <label class="field"><span class="field__label">Code from My account &gt; Runners</span>
                    <input class="field__input" id="runner-code" name="code" required autocomplete="off"
                           placeholder="ABCDE-FGH23"></label>
            </div>
            <p class="field__hint" id="runner-pair-error" role="alert"></p>
            <div class="form-actions"><button class="button" type="submit">Connect</button></div>
        </form>
    </section>
</main>
<script src="/js/runner-home.js"></script>
</body>
</html>

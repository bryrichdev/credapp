# Staging (on the Mac, through deploy/deploy.sh) and production (on EC2, through
# deploy/aws/deploy.sh). Each is its own compose project with its own .env:
#   APP_TAG=<commit> docker compose -f deploy/compose.yml -p credcloud-staging --env-file ~/credcloud/staging/.env up -d
# No ports are published: the tunnel is the only way in.
services:
  app:
    # APP_IMAGE is the ECR repository on EC2; the Mac uses its local credcloud images.
    image: ${APP_IMAGE:-credcloud}:${APP_TAG:?set APP_TAG to the commit to run}
    environment:
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      CREDAPP_CLOUDFLARE_TRUST_CLIENT_IP: "true"
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      CREDAPP_SSN_KEY: ${CREDAPP_SSN_KEY}
      # Links in emails start with this, e.g. https://staging.credcloud.app
      CREDAPP_BASE_URL: ${CREDAPP_BASE_URL:?set CREDAPP_BASE_URL in this environment's .env}
      # Outgoing email. Leave MAIL_HOST unset and emails are only logged.
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # Document files. Empty means Postgres; EC2 sets these from Parameter Store (aws/workspace-files.tf).
      CREDAPP_STORAGE: ${CREDAPP_STORAGE:-database}
      CREDAPP_STORAGE_BUCKET_PREFIX: ${CREDAPP_STORAGE_BUCKET_PREFIX:-}
      CREDAPP_STORAGE_DATA_ROLE_ARN: ${CREDAPP_STORAGE_DATA_ROLE_ARN:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      # Shown on /privacy for questions and data requests.
      CREDAPP_CONTACT_EMAIL: ${CREDAPP_CONTACT_EMAIL:-}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  data: